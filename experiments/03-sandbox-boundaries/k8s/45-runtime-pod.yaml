# The pod of the runtime comparison (diag/run-runtime.sh, capture/setup.sh a): one idle `sleep`, the same image and
# settings on both runtimes. POD_NAME, RUNTIME_LINE and SLEEP_SECONDS are substituted. No limits, on purpose: the
# comparison shows the memory each pod sees. Written to the "restricted" level its namespace enforces.
apiVersion: v1
kind: Pod
metadata: {name: POD_NAME, namespace: lab-agent, labels: {app: agent}}
spec:
  RUNTIME_LINE
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
  containers:
  - name: POD_NAME
    image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    command: ["sleep", "SLEEP_SECONDS"]
    securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
