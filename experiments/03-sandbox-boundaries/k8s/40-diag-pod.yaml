# Fixed diagnostic pod: same namespace, labels, service account (k8s/05), user id, security settings and runtime as
# the agent's pod. RUNTIME is substituted by the scripts (kata-qemu, or the line removed for the default runtime, runc).
# /tmp is an emptyDir: the root filesystem is read-only and the probes keep one scratch file there.
apiVersion: v1
kind: Pod
metadata: {name: diag, namespace: lab-agent, labels: {app: agent}}
spec:
  runtimeClassName: RUNTIME
  serviceAccountName: agent
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
  containers:
  - name: diag
    image: curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
    command: ["sleep", "86400"]
    securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
    resources: {limits: {cpu: "1", memory: 512Mi}}
    volumeMounts: [{name: tmp, mountPath: /tmp}]
  volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
