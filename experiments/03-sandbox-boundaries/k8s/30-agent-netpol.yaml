# The restriction under test: pods in lab-agent may open connections to the gateway pod on 8080 and nothing else.
# No DNS rule: the pod is given the gateway's address, so it needs no name resolution.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: agent-egress-gateway-only, namespace: lab-agent}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: lab-gateway}}
      podSelector: {matchLabels: {app: gateway}}
    ports: [{protocol: TCP, port: 8080}]
