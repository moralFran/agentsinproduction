# The validator's namespace: no egress or ingress at all, no credentials, and the "restricted" Pod Security level
# enforced. One short-lived pod per check (k8s/71-validator-pod.yaml): it runs the patch's code.
apiVersion: v1
kind: Namespace
metadata: {name: lab-validate, labels: {pod-security.kubernetes.io/enforce: restricted}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: deny-all, namespace: lab-validate}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
