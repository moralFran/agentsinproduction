# T3 (2026-11-13): the policy of experiment 03 (k8s/30-agent-netpol.yaml there), in a namespace of this lab. It is applied
# AFTER the pods of the namespace are running. The gateway's own ingress policy admits only ci-agent, so from this
# namespace nothing is reachable once the policy applies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: agent-egress-gateway-only, namespace: NAMESPACE}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ci-gateway}}
      podSelector: {matchLabels: {app: gateway}}
    ports: [{protocol: TCP, port: 8080}]
